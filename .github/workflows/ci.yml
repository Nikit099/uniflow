name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e 'apps/api[dev]'
      - run: ruff check apps/api/app apps/api/tests
      - run: mypy apps/api/app
      - run: pytest apps/api/tests -q
      - run: PYTHONPATH=apps/api python scripts/export_openapi.py && git diff --exit-code openapi.yaml
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint && npm run typecheck && npm test && npm run build
        working-directory: apps/web
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: npm ci && npm run test:e2e
        working-directory: apps/web
      - run: if git grep -nE '(sk-[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH) PRIVATE KEY)' -- . ':!apps/web/package-lock.json'; then exit 1; fi
      - if: always()
        run: docker compose down -v
