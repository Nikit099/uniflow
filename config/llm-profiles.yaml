providers:
  primary:
    type: openai_compatible
    base_url_env: LLM_PRIMARY_BASE_URL
    api_key_env: LLM_PRIMARY_API_KEY
    models_from_env: LLM_PRIMARY_MODEL
  gigachat:
    type: gigachat_oauth
    authorization_key_env: LLM_GIGACHAT_AUTHORIZATION_KEY
    scope_env: LLM_GIGACHAT_SCOPE
    base_url_env: LLM_GIGACHAT_BASE_URL
    oauth_url_env: LLM_GIGACHAT_OAUTH_URL
    models_from_env: LLM_GIGACHAT_MODEL
  routerai:
    type: openai_compatible
    base_url_env: LLM_ROUTERAI_BASE_URL
    api_key_env: LLM_ROUTERAI_API_KEY
    models_from_env: LLM_ROUTERAI_MODEL

pipelines:
  requirement_explainer:
    provider: primary
    prompt: requirement_explainer_v1
  student_question_router:
    provider: primary
    prompt: student_router_v1
  staff_case_summary:
    provider: primary
    prompt: case_summary_v1
  plain_language_translation:
    provider: primary
    prompt: plain_language_v1
